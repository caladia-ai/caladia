# Cloudflare Pages configuration for caladia-ai/caladia.
#
# This file is read by Cloudflare Pages when the project is connected
# to the repo via the dashboard's Git integration. It controls the
# Pages runtime settings — compatibility date and serve directory.
#
# Build settings (build command, install command, root directory)
# live in the Cloudflare dashboard, NOT in this file — Cloudflare
# Pages does not support a [build] section in wrangler.toml. Set
# them at project creation time, or afterwards under Settings →
# Builds & deployments:
#
#   Build command:           pnpm install --frozen-lockfile && pnpm -r build
#   Build output directory:  packages/app/dist
#   Production branch:       main
#
# Deploy model: Cloudflare-managed auto-build. On push to `main`,
# Cloudflare runs the build command above and serves the output
# directory. Preview builds fire on every branch. No GitHub Actions
# deploy step is needed; CI runs typecheck + tests only.

name = "caladia"
compatibility_date = "2026-05-28"
pages_build_output_dir = "packages/app/dist"
