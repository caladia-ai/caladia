<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Caladia</title>
    <meta
      name="description"
      content="Business process simulator. Draw a diagram, get a live Gantt, run Monte Carlo forecasts on schedule and cost. Local-first, open-source, no backend."
    />

    <!-- Open Graph — title is the richer "what is this" string; tab title above
         stays "Caladia" so the browser tab isn't a paragraph. -->
    <meta property="og:title" content="Caladia — Draw your process. See the schedule and cost." />
    <meta
      property="og:description"
      content="Business process simulator. Draw a diagram, get a live Gantt, run Monte Carlo forecasts on schedule and cost. Local-first, open-source, no backend."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.caladia.ai" />
    <meta property="og:site_name" content="Caladia" />
    <meta property="og:image" content="https://app.caladia.ai/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Caladia — Draw your process. See the schedule and cost."
    />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Caladia — Draw your process. See the schedule and cost." />
    <meta
      name="twitter:description"
      content="Business process simulator. Draw a diagram, get a live Gantt, run Monte Carlo forecasts on schedule and cost. Local-first, open-source, no backend."
    />
    <meta name="twitter:image" content="https://app.caladia.ai/og-image.jpg" />

    <!-- Tailwind bg-gray-50 (light root) / bg-gray-950 (dark root). The browser
         paints the address bar / system chrome with these so first-paint matches
         the app surface and there's no flash of white before the bundle loads. -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />

    <!-- Inline-SVG favicon mirroring caladia-webpage's Layout.astro:61 so brand
         identity stays consistent between marketing and app. Four rounded
         squares with a connecting wire — schematic stand-in for a block
         diagram. No external file needed. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='14' y='14' width='30' height='22' rx='3' fill='none' stroke='%231a1f2e' stroke-width='4'/%3E%3Crect x='56' y='14' width='30' height='22' rx='3' fill='none' stroke='%232C7A7B' stroke-width='4'/%3E%3Crect x='14' y='56' width='30' height='22' rx='3' fill='none' stroke='%23DD6B47' stroke-width='4'/%3E%3Crect x='56' y='56' width='30' height='22' rx='3' fill='none' stroke='%231a1f2e' stroke-width='4'/%3E%3Cpath d='M44 25 Q50 25 56 25' stroke='%231a1f2e' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Audit I-34 — boot-time feature-detect. Runs synchronously before
         the React bundle loads. If any critical Web API is missing, the
         #root div is swapped for a static "browser too old" message
         instead of rendering Caladia into a doomed environment. Kept as
         plain ES5-ish JS (no `let` / `const` / arrow functions) so the
         detect itself can run on the very browsers we're refusing. The
         supported-browsers list mirrors the `browserslist` field in
         package.json and the build.target in vite.config.ts. -->
    <script>
      (function () {
        var missing = [];
        if (typeof Worker === 'undefined') missing.push('Web Workers');
        if (typeof indexedDB === 'undefined') missing.push('IndexedDB');
        if (
          typeof window.crypto === 'undefined' ||
          typeof window.crypto.randomUUID !== 'function'
        ) {
          missing.push('crypto.randomUUID');
        }
        if (typeof structuredClone !== 'function') missing.push('structuredClone');
        if (missing.length === 0) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div style="max-width:560px;margin:80px auto;padding:24px;font-family:system-ui,-apple-system,sans-serif;color:#1f2937;line-height:1.5;">' +
          '<h1 style="font-size:20px;margin:0 0 12px;">Your browser is too old for Caladia</h1>' +
          '<p style="margin:0 0 12px;">Caladia needs <strong>' +
          missing.join('</strong>, <strong>') +
          '</strong> to run, and your browser doesn’t expose ' +
          (missing.length === 1 ? 'that API' : 'those APIs') +
          '. Please upgrade to a recent version of Chrome, Firefox, Safari, or Edge.</p>' +
          '<p style="margin:0;font-size:13px;color:#6b7280;">Minimum supported versions:' +
          ' Chrome 100+, Firefox 100+, Safari 15.4+, Edge 100+ (all released 2022).</p>' +
          '</div>';
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
